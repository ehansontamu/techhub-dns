name: Align dev after release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  align-dev:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward dev to main
        run: |
          git fetch origin main dev

          if git merge-base --is-ancestor origin/dev origin/main; then
            git push origin origin/main:refs/heads/dev
          else
            echo "dev advanced after the release merge; leaving it unchanged."
          fi
